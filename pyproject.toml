[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-device-lab"
version = "0.2.0.dev0"
requires-python = ">=3.10"
description = "WIP programmable USB device fuzzing laboratory"

[project.scripts]
usb-device-lab = "usb_device_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["usb_device_lab*"]
