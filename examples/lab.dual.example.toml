# Replace UDC/driver, absolute paths, username, keys and UART settings.
[gadget]
udc = "fe980000.usb"
udc_driver = "fe980000.usb"
# udc_driver is USB_UDC_NAME from /sys/class/udc/<udc>/uevent, NOT device/driver.
device_config = "/CHANGE_ME/usb-device-lab/corpus/seeds/hid-keyboard.json"
profile = "raspberry-pi-4"
[telemetry]
schema_version = 1
mode = "uart"
[uart]
port = "/dev/serial/by-id/CHANGE_ME"
baudrate = 115200
data_bits = 8
parity = "none"
stop_bits = 1
read_timeout = 0.25
reconnect_delay = 1.0
read_chunk_bytes = 4096
[ssh]
host = "10.10.10.208"
user = "YOUR_HOST_USER"
port = 22
identity_file = "/CHANGE_ME/id_ed25519"
known_hosts_file = "/CHANGE_ME/known_hosts"
use_sudo = true
connect_timeout = 5
read_timeout = 0.1
read_chunk_bytes = 4096
lease_seconds = 0 # No overall SSH capture lifetime limit; stop remains available.
[corpus]
seed_dir = "/CHANGE_ME/usb-device-lab/corpus/seeds"
manifest = "/CHANGE_ME/usb-device-lab/corpus/manifest.toml"
families = ["hid"]
profiles = ["hid/keyboard"]
strategy = "round-robin"
[campaign]
iterations = 3
seconds = 2
seed = 42
feedback = "none"
pre_run_quiet_seconds = 0.5
post_run_capture_seconds = 1.0
[run]
corpus_out = "/CHANGE_ME/state/corpus"
results_dir = "/CHANGE_ME/state/results"
logs_dir = "/CHANGE_ME/state/logs"
