name: UART integration
on:
  push:
    branches: [feature/uart-agentless]
  pull_request:
    paths:
      - 'usb_device_lab/**'
      - 'tests/test_uart*.py'
      - 'scripts/run_uart_tests.py'
      - '.github/workflows/uart-integration.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare diagnostics directory
        run: mkdir -p uart-ci-results
      - name: Install project
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -e . 2>&1 | tee uart-ci-results/install.log
      - name: Compile Python modules and tests
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q usb_device_lab tests scripts/run_uart_tests.py 2>&1 | tee uart-ci-results/compile.log
      - name: UART unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_uart_tests.py --output uart-ci-results/report.json 2>&1 | tee uart-ci-results/tests.log
      - name: Check browser script syntax
        shell: bash
        run: |
          set -o pipefail
          python -c "from usb_device_lab.uart_web import SCRIPT; import subprocess; subprocess.run(['node', '--check'], input=SCRIPT, check=True)" 2>&1 | tee uart-ci-results/javascript.log
      - name: Preserve diagnostic artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uart-ci-python-${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: uart-ci-results/
          if-no-files-found: warn
          retention-days: 7
