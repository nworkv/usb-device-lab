name: UART integration
on:
  push:
    branches: [feature/uart-agentless]
  pull_request:
    paths:
      - 'usb_device_lab/**'
      - 'tests/test_uart*.py'
      - '.github/workflows/uart-integration.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python modules and tests
        run: python -m compileall -q usb_device_lab tests
      - name: UART unit and integration tests
        run: python -m unittest discover -s tests -p 'test_uart*.py' -v
      - name: Check browser script syntax
        run: python -c "from usb_device_lab.uart_web import SCRIPT; import subprocess; subprocess.run(['node', '--check'], input=SCRIPT, check=True)"
