name: Agentless UART and SSH
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dual-transport:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python -m compileall -q usb_device_lab tests scripts
      - run: bash -n scripts/pi_dual_setup.sh
      - run: python scripts/check_uart_checkpoint_source.py
      - run: python scripts/run_uart_tests.py --output /tmp/uart-regression.json
      - run: python -m unittest discover -s tests -p 'test_dual_*.py' -v
      - run: |
          python - <<'PY'
          import subprocess
          from usb_device_lab.dual_ui import SCRIPT
          subprocess.run(['node', '--check'], input=SCRIPT, check=True)
          PY
