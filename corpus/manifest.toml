# Seed corpus manifest. Each profile maps to corpus/seeds/<family>-<profile>.json.
# Regenerate the JSON files with: python3 scripts/gen_seeds.py
# Select a subset in lab.toml: [corpus] families = ["hid"] or profiles = ["hid/mouse", "acm"].
[corpus]
format = 1
seed_dir = "seeds"

[[family]]
name = "hid"
profiles = ["keyboard", "mouse", "consumer-control", "gamepad", "multi-report"]

[[family]]
name = "audio"
profiles = ["uac1-playback", "uac1-capture", "uac1-duplex"]

[[family]]
name = "cdc"
profiles = ["acm", "ecm"]

[[family]]
name = "storage"
profiles = ["bulk-only"]

[[family]]
name = "midi"
profiles = ["midi-streaming"]

[[family]]
name = "uvc"
profiles = ["streaming"]

[[family]]
name = "composite"
profiles = ["hid-cdc", "hid-audio", "hid-storage"]

[[family]]
name = "boundary"
profiles = ["multi-config", "multi-altsetting", "endpoint-matrix"]
